apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-web
  labels:
    app.kubernetes.io/name: capstone-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capstone-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: replace-at-deploy/capstone-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: capstone-web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: capstone-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone-web